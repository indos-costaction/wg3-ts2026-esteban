.boxed-content[
.large[Researchers who share, or use shared, neuroimaging data face four interrelated challenges:]
]

.cards.brand.cols-4[
.card[
.section-icon.corner[<i class="fa-solid fa-check-double"></i>]

.kicker[WG1]

### Data quality

No standard for assessing data quality.
]
.card[
.section-icon.corner[<i class="fa-solid fa-tags"></i>]

.kicker[WG2]

### Metadata

Metadata are missing.
]
.card[
.section-icon.corner[<i class="fa-solid fa-gears"></i>]

.kicker[WG3]

### Preprocessing

No standard preprocessing pipelines.
]
.card[

.kicker[WG4]

### Ethics and law

Unclear ethics and legal regulations of data sharing.
]

This is the Action's challenge, as written in its Memorandum of Understanding: "lacking standardization of data quality assessment and preprocessing pipelines, missing metadata, and unclear data sharing ethics and legal regulations."

Each challenge has a working group. WG5 takes care of dissemination and communication across all of them.

# How the Journal Club works

.cards.steps[
.card[
.enum[1]

**Claim** up to 3 papers at a time. Each claim runs for 12 days, with one 7-day extension.
]
.card[
.enum[2]

**Annotate** the PDF inline: what you did not understand, what has been contested or superseded, what matters for INDoS (data sharing, standardization, reproducibility).
]
.card[
.enum[3]

**Sign it off** from your GitHub account. **No AI** may be used to read, summarize, or annotate.
]
.card[
.enum[4]

**Graded** on a 5-axis rubric, with critical appraisal weighing most. A paper is done at 3 reviews.
]
]

.boxed-content[
.cta[
**This afternoon**: 15:00 How to read and review a neuroimaging paper, with Mélanie Garcia &middot; 16:00-17:45 Journal Club, in practice.
]
]

???

Rules as enforced by the tracking system (RULES.md in the journal-club repository): at most 3 active claims per person, a paper closes to new claims once 5 people hold it, done at 3 completed reviews, quality floor of 2.0 out of 5.

The five axes: engagement and coverage, comprehension, critical appraisal, action relevance, originality (non-AI).
