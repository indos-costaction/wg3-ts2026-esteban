# The neuroimaging research workflow

.boxed-content[
<object type="image/svg+xml" data="images/neuroimaging-workflow-large.svg" style="width: 100%; padding-top: 20pt;"></object>

.center[
[Esteban et al., (2020)](https://doi.org/10.1038/s41596-020-0327-3);
[Niso et al., (2022)](https://doi.org/10.1016/j.neuroimage.2022.119623)
]
]

???

In broad strokes, this is the neuroimaging research workflow.

It looks like any machine learning pipeline: we acquire data, perform quality control, preprocess, define features, and then apply statistical modeling to extract insights.

The two references below give a deeper dive into the details of the workflow.

The selling points are:

- Data collection and organization is mostly data management. Sequences improve over time and that demands updates in the data management workflow (e.g., BIDS conversion), but you can get a very stable solution here.
- Statistical modeling requires some flexibility to come up with new and better models, so we may allow some analytical variability not to stymie progress.
- Preprocessing is the step in between, where standardization can (i) give you as an individual researcher a solid ground for this and future studies; (ii) make your study more comparable to others who standardize the same way.

]
]

???

Next in the workflow is preprocessing, which transforms raw data into something models can reliably interpret.

For example, it identifies signals of no interest for their cleaning or accounting within modeling.

In neuroimaging, preprocessing also deals with accurately locating signals and objects in space and time, and often the definition of relevant brain regions that focus the analysis.

A decade ago, we might have called it "feature engineering."

This is the step this talk is about.

# Why do data require preprocessing?

.large.center[
<i class="fa-solid fa-circle-exclamation"></i> MRI measurements *generally* **cannot** be directly analyzed.
]

.cards.cols-2.brand[
.card[
.section-icon.corner[<i class="fa-solid fa-map-pin"></i>]

.kicker[consistency and accuracy]

### Spatiotemporal location

* **within runs**: head-motion, slice-timing
* **within individuals**: coregistration between runs and with anatomy, susceptibility distortions
* **across subjects**: spatial normalization
]
.card[
.section-icon.corner[<i class="fa-solid fa-location-crosshairs"></i>]

.kicker[confounders and covariates]

### Signal *validity*

* confounders such as global signals, signal drifts, DVARS
* known artifacts such as head-motion parameters and derivations
* spatiotemporal filtering to increase SNR
]
]

.admonition[
<i class="fa-solid fa-bullseye"></i> **End goal**: minimize false positives without increasing false negatives.
]

???

MRI measurements generally cannot be directly analyzed.

All analyses require consistency and accuracy in spatiotemporal location: the signal must be drawn from the same location, at the accurate time, at all time points, and sampled consistently with the analysis design (e.g., surface or volume).
That applies within runs (head motion, slice timing), within individuals (coregistration between runs, coregistration with anatomy, susceptibility distortion), and across subjects (spatial normalization).

All analyses must also consider confounders and covariates that undermine the validity of the measurements: extraction of confounds, identification of and accounting for artifacts, spatiotemporal filtering for denoising.

The end goal is to minimize false positives without increasing false negatives.

# Example: susceptibility distortion

.center[
<object type="image/svg+xml" data="images/sdc-the-problem.svg" style="width: 72%;"></object>
]

???

Here is one concrete example of the spatial location problem: susceptibility distortions.

Echo-planar images are geometrically distorted along the phase-encoding direction, near air-tissue interfaces.
If not accounted for, the signal of a voxel is not drawn from where we think it is.

# Analytical variability

.cards.goals[
.card[
.marker[<i class="fa-solid fa-triangle-exclamation"></i>]

**Diffusion MRI**: tractography challenge ([Maier-Hein et al., 2017](https://doi.org/10.1038/s41467-017-01285-x))
.gray-text[Tractography-based connectomes are dominated by false-positive connections]
]
.card[
.marker[<i class="fa-solid fa-triangle-exclamation"></i>]

**Functional MRI**: NARPS ([Botvinik-Nezer et al., 2020](https://doi.org/10.1038/s41586-020-2314-9))
.gray-text[Single dataset, 70 teams, 9 *ex-ante* hypotheses: striking analytical variability, even among teams using the same preprocessing]
]
.card[
.marker[<i class="fa-solid fa-triangle-exclamation"></i>]

**Resting-state fMRI**: [Li et al., (2024)](https://doi.org/10.1038/s41562-024-01942-4)
.gray-text[Single test-retest dataset, 5 pipelines: moderate inter-pipeline agreement, limiting cross-study replicability]
]
]

.admonition.warning[
<i class="fa-solid fa-circle-right"></i> The reproducibility of preprocessing **sets bounds** to the reproducibility of downstream analyses.
]

???

Although simple on the surface, the workflow is highly complex and each step introduces potential variability.

Every lab around the world might use a slightly different pipeline.
Different tools and different parameters lead to inconsistent results.
This fragmentation hinders progress and precludes between-study comparisons.

The reproducibility of preprocessing sets bounds to the reproducibility of downstream analyses.

# Two ways to more reliable measurements

.cards.cols-2.brand[
.card[
.section-icon.corner[<i class="fa-solid fa-repeat"></i>]

.kicker[strategy 1]

### Repeat the measurement

Random errors cancel out.
]
.card[
.section-icon.corner[<i class="fa-solid fa-ruler-combined"></i>]

.kicker[strategy 2]

### Standardize the procedure

Reduce methodological variance (potentially at the cost of bias).
]
]

.admonition.warning[
Both strategies *reduce the variance* of the measurement. Neither ensures the **validity** of the measurement.
]

???

There are two ways of increasing the reliability of measurements.

Repeat the measurement: random errors cancel out.

Standardize the measurement procedure: reduce the variance coming from methodology, potentially at the cost of introducing bias.

Both strategies reduce the variance of the measurement.
Neither ensures its validity: that is still on us, and it is why validation matters.

class: vcenter

# Beyond analytical variability

.cards.cols-2.brand[
.card[
.section-icon.corner[<i class="fa-solid fa-dice"></i>]

.kicker[randomness]

### Random seeds

Keep track of them (do *not* fix them) and report them.
]
.card[
.section-icon.corner[<i class="fa-solid fa-calculator"></i>]

.kicker[numerical precision]

### Floating-point arithmetic

Random rounding of calculations uncovered substantial changes between patch releases of *fMRIPrep*.

.foot[[Chatelain et al., (2023)](https://doi.org/10.48550/arXiv.2307.01373)]
]
]

???

Beyond analytical variability, other sources of variability are on the way.

Random seeds: keep track of them and report them, rather than fixing them.
Fixing a seed hides the variability rather than removing it.

Chatelain and colleagues introduced random rounding of floating-point calculations and uncovered substantial changes between patch releases of fMRIPrep.

# Why pipelines, why automation

.cards.cols-3.tight.brand[
.card[
.section-icon.corner[<i class="fa-solid fa-receipt"></i>]

.kicker[provenance]

### Transparency

Every run records what was executed, with which version and settings, and shows it in a visual report.
]
.card[
.section-icon.corner[<i class="fa-solid fa-layer-group"></i>]

.kicker[scale]

### One procedure, any size

The same steps for one participant or for large consortia such as ENIGMA.
]
.card[
.section-icon.corner[<i class="fa-solid fa-toolbox"></i>]

.kicker[best practice]

### Encoded once

Tools selected for their strengths, implemented once and reused by everyone.
]
.card[
.section-icon.corner[<i class="fa-solid fa-vial-circle-check"></i>]

.kicker[testing]

### CI and versions

Continuous integration, exact versions, long-term support releases.
]
.card[
.section-icon.corner[<i class="fa-solid fa-people-group"></i>]

.kicker[community review]

### Many eyes

Open source: bug reports, feature requests and questions review every decision.
]
.card.accent[
.section-icon.corner[<i class="fa-solid fa-industry"></i>]

.kicker[in short]

### DevOps-inspired

Software engineering practice brought into the research workflow.
]
]

???

Why pipelines, and why automate them?

Provenance and transparency: an automated pipeline records what was run, which version and which settings, and reports it back through visual reports.

Scale: the same procedure applies to one participant or to large consortia such as ENIGMA, without a human re-deciding every step.

Best practice encoded once: select the tools from each suite according to their strengths, implement once, reuse everywhere, instead of every lab re-implementing its own variant.

Testing: continuous integration and validation, exact versioning, long-term support releases.

Community review: open source, bug reports, feature requests and questions on NeuroStars mean many eyes look at every decision.
Community is critical to provide a footing for standardization, following BIDS' experience.

In short: DevOps-inspired standardization, integrating software engineering best practices from industry into the neuroimaging workflow and reducing the gap between research and application.

# fMRIPrep's design

.cards.cols-3.brand[
.card[
.section-icon.corner[<i class="fa-solid fa-shield-halved"></i>]

.kicker[robust and adaptive]

### Minimal requirements

* T1w + BOLD run
* uses T2w/FLAIR, field maps when available
* multi-echo BOLD
]
.card[
.section-icon.corner[<i class="fa-solid fa-diagram-project"></i>]

.kicker[cross-suite tooling]

### Best of each suite

* tools selected according to their strengths
* *Nipype* abstracts tool details into modular workflows
]
.card[
.section-icon.corner[<i class="fa-solid fa-ruler-combined"></i>]

.kicker[standards and best practices]

### Standardized

* BIDS (inputs), BIDS-Derivatives (outputs), BIDS Apps
* containers, versioning, LTS, open source, CI/CD
* visual reports
]
]

.slide-footer.small[
[Esteban, (2025)](https://doi.org/10.1007/978-1-0716-4260-3_8)
]

???

fMRIPrep's design has three pillars.

Robust and adaptive: minimal requirements (a T1w image and a BOLD run), and it uses additional scans (T2w or FLAIR, field maps) when available. It can preprocess multi-echo BOLD.

Cross-suite tooling: select the tools from each suite (AFNI, ANTs, FreeSurfer, FSL) according to their strengths, and use Nipype to abstract away tool details and build modular workflows.

Standardization and best practices: BIDS for the inputs, BIDS-Derivatives for the outputs, BIDS Apps for the architecture; containers, versioning, LTS, open source, CI/CD; and visual reports.

# Constraints and limitations

.cards.cols-3.brand[
.card[
.section-icon.corner[<i class="fa-solid fa-scissors"></i>]

.kicker[analysis-agnostic]

### Minimal preprocessing

*Conservative*: it will not regress out signals or apply smoothing kernels. Confounds are collected; the analyst decides.
]
.card[
.section-icon.corner[<i class="fa-solid fa-user"></i>]

.kicker[cross-sectional]

### Anatomy is stable

Assumes the individual's anatomy does not change across sessions (anatomical images are averaged).
]
.card[
.section-icon.corner[<i class="fa-solid fa-chart-pie"></i>]

.kicker[scope]

### The 80/20 principle

Cover what most studies need, well, rather than every corner case.
]
]

???

The constraints are deliberate.

Agnostic to downstream analysis: fMRIPrep applies minimal processing and refrains from analysis-specific steps. It will not regress out signals nor apply smoothing kernels. It collects confounds, and the analyst decides how to use them.

Cross-sectional: fMRIPrep assumes the individual's anatomy does not change across sessions.

Driven by the 80/20 principle: the scope is kept to what most users need. Keeping the scope tight is what keeps a standard maintainable.

# Standardization in the research workflow

# Standardizing preprocessing: validation

.boxed-content.center[
<img src="images/fmriprep-validation-workflow.png" alt="fMRIPrep validation protocol" style="width: 34%" /><br />
(<a href="https://doi.org/10.1038/s41592-018-0235-4">Esteban et al., 2019</a>)
]

???

The validation protocol: sample participants from many datasets, run fMRIPrep, look at the visual reports, triage the issues found, fix them, check that the CI tests pass, and release. Then repeat.

Validation is not a one-off: every release is tested through continuous integration.

# NiPreps produce analysis-grade data

.boxed-content[
.larger.center[
"*analysis-grade*" data <i class="fa-solid fa-circle-right"></i> data **directly consumable by analyses**
]

.pull-left[
<br />
*Analysis-grade* data is an analogy to the concept of "*sushi-grade* (or [sashimi-grade](https://en.wikipedia.org/wiki/Sashimi)) fish" in that both are:

.large[<i class="fa-solid fa-circle-right"></i> **minimally preprocessed**,]

and

.large[<i class="fa-solid fa-circle-right"></i> **safe to consume** directly.]
]

.pull-right.center[
<img src="images/nipreps-transparent.png" alt="NiPreps" style="width: 100%" />
<a href="https://www.nipreps.org"><object type="image/svg+xml" data="images/qr-nipreps-url.svg" style="width: 32%"></object><br />
www.nipreps.org</a>
]
]

???

NiPreps (NeuroImaging PREProcessing toolS) generalizes fMRIPrep: a framework for standardized preprocessing pipelines in neuroimaging.

I often use the "sushi-grade" analogy: just like sushi-grade fish is minimally processed but safe to consume, NiPreps yields "analysis-grade" data, with minimal processing interventions but ready for direct consumption by analyses.

# The NiPreps ecosystem

.center[
<object type="image/svg+xml" data="https://www.nipreps.org/identity/nipreps-general/nipreps-chart.svg" style="width: 55%"></object><br />
<em>NiPreps</em> (<a href="https://doi.org/10.31219/osf.io/ujxp6">Esteban et al., 2020</a>)
]

???

Here's the basic architecture.

It's an ecosystem of modular tools at four levels of abstraction:

- End-user applications: fMRIPrep, sMRIPrep, dMRIPrep, PETPrep, and MRIQC for quality control.
- Middleware utilities: SDCFlows, TemplateFlow, NiBabies, NiRodents, MRIQC-learn, CrowdMRI.
- Software infrastructure: NiPype, NiBabel, NiWorkflows, NiTransforms, BIDS and PyBIDS.
- Foundational packages the pipelines build on: AFNI, ANTs, FSL, FreeSurfer, Connectome Workbench, DIPY, ITK, Nilearn, scikit-image, scikit-learn.

This is the MRI side of what WG3 wants to map across modalities.

The NiPreps framework keeps extending.

PETPrep has been officially released, and there are plans for a "FactoryPrep" that allows creating neuroimaging workflows.

The fit and transform paradigm: estimate once, then produce lightweight, deterministically reproducible outputs.

NiFreeze: head-motion estimation (and correction) across modalities.

The pattern repeats: identify what is common to a modality, standardize it, validate it, and let a community carry it.

To recap.

MRI data cannot be directly analyzed: spatiotemporal location, signal validity, and analytical variability.

Preprocessing is an area with standardization potential.

fMRIPrep is an example of implementation in fMRI, with its design principles, its constraints, and visual reports.

NiPreps generalize fMRIPrep, with the concept of analysis-grade data.
