# Publish the decks to GitHub Pages.
#
# The site is the repository as it is: static HTML, no build. The workflow
# only checks out the slide engine (the `remark` submodule) and uploads.
# Decks are served under the organisation's domain, at
# https://www.indos-costaction.eu/wg3-ts2026-esteban/
#
# Requires Settings -> Pages -> Source = "GitHub Actions".
name: Deploy slides

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel one that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Check out the slide engine
        run: git submodule update --init remark

      - uses: actions/configure-pages@v5

      # upload-pages-artifact dereferences symlinks, so the deck's roster.yml
      # symlink that roulette.js fetches at run time survives.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
