# Publish the decks to GitHub Pages, at
# https://www.indos-costaction.eu/wg3-ts2026-esteban/
#
# The site is only ever a published release: publishing a GitHub release
# deploys that release, and pushing to main deploys nothing. The same
# release is what Zenodo archives, so the live slides and the record with
# the DOI are always the same version. Running the workflow by hand
# redeploys the latest release.
#
# The site is the repository as it is: static HTML, no build. The workflow
# only checks out the slide engine (the `remark` submodule) and uploads.
#
# Requires Settings -> Pages -> Source = "GitHub Actions", and the
# github-pages environment must allow deployments from tags matching v*
# (Settings -> Environments -> github-pages), since a release runs on its tag.
name: Deploy slides

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel one that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Always the latest full release: never a draft or a prerelease, nor an
      # older tag published after a newer one. Fails when there is no release.
      - name: Find the latest release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}
          submodules: false

      - name: Check out the slide engine
        run: git submodule update --init remark

      - uses: actions/configure-pages@v5

      # upload-pages-artifact dereferences symlinks, so the deck's roster.yml
      # symlink that roulette.js fetches at run time survives.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
